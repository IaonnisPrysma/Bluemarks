name: Bluemarks
version: ${version}
main: dev.iaonnis.bluemarks.Bluemarks
api-version: 1.19
folia-supported: true
# Bluemarks by iaonnis. Built on BlueMapSignMarkers by kugge (https://github.com/KaiijuMC/BlueMapSignMarkers)
# and BlueMapPortalMarkers by Max Aldis (https://github.com/maldis018/BlueMapPortalMarkers).
authors: [iaonnis, kugge, Max Aldis]
depend: [BlueMap]
description: Sign markers and nether portal markers for BlueMap (fork of BlueMapSignMarkers + BlueMapPortalMarkers)
commands:
  bluemarks:
    description: Bluemarks admin commands.
    usage: /bluemarks portals <reload|sweep|stats|purge>
    permission: bluemarks.admin
permissions:
  bluemarks.admin:
    description: Use the /bluemarks admin commands.
    default: op
